# Course template - Lab 1 compose contract (API.md section 9).
# The checker enforces: a service named exactly "svcdesk", port 8080 inside the container,
# SVCDESK_TEST_CLOCK set, no host-path bind mounts on any service, and images that need
# no network once built (dependencies are installed at build time, never at start).
services:
  svcdesk:
    build: .                      # copy Dockerfile.example to Dockerfile, or write your own
    ports:
      - "8080:8080"               # recommended for local work; the checker removes it in container mode
    environment:
      SVCDESK_TEST_CLOCK: "1"     # required: enables the X-Test-Clock header (API.md section 8)
      KB_INDEX_URL: http://kb-index:8080    # Lab 3 M-02
    depends_on:
      - kb-index
    volumes:
      - svcdesk-data:/data        # a NAMED volume is fine; "./data:/data" (a bind mount) fails check 1.02
    # Makes "docker compose up --wait" wait for readiness, and lets the "tests" service below
    # depend on "service_healthy" instead of racing a cold start.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: "MichalPacula"    # M-01: my GitHub login
    ports:
      - "8081:8080"                         # optional: /stats and /admin/degrade
    # No healthcheck: the image has no shell (L3-CORE-1.04).

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  # Lab 3 Stretch 2: Toxiproxy in front of svcdesk (HANDOUT.md); `docker compose --profile gap up -d toxiproxy`
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles: ["gap"]
    ports:
      - "8474:8474"   # API
      - "8666:8666"   # the proxy in front of svcdesk

  # Stretch S3 (own tests). The checker builds every image up front
  # (docker compose --profile tests build; a tests image that does not build costs S3, never Core), then runs
  #   docker compose --profile tests run --rm --build tests
  # (300 s cap) and requires exit code 0 and a last stdout line "ITSMLAB-TESTS: passed=<n> failed=0" with n >= 10.
  # The runner lives at src/tests/run.py (Dockerfile.example copies src/ to /app/src, so it is importable
  # as tests.run from /app/src) and itself retries /health for a few seconds, on top of depends_on below.
  # Like svcdesk, the tests image is built before the grader blocks egress: install everything at build time.
  tests:
    build: .
    profiles: ["tests"]
    working_dir: /app/src
    depends_on:
      svcdesk:
        condition: service_healthy
    environment:
      SVCDESK_URL: http://svcdesk:8080   # the tests read the service URL from this variable
    command: ["python", "-m", "tests.run"]   # runs the suite, prints the ITSMLAB-TESTS line last

volumes:
  svcdesk-data:
